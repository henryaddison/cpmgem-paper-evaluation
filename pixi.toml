pint = { version = "==0.21" }
pip = { version = "==23.1.2" }
pysteps = { version = "==1.7.1" }
python = { version = "==3.9.15" }
python-cdo = { version = "==1.6.0" }
python-dotenv = { version = "==1.0.0" }
scikit-learn = { version = "==1.2.2" }
