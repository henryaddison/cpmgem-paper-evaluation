[workspace]
authors = ["Henry Addison <henryaddison@users.noreply.github.com>"]
channels = ["conda-forge", "nodefaults"]
name = "CPMGEM paper evaluation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
black = { version = "==22.10.0" }
bottleneck = { version = "==1.3.7" }
